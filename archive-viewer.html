<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive Viewer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;600&display=swap');

  :root {
    --bg: #0a0a0b;
    --surface: #131315;
    --surface2: #1a1a1e;
    --surface3: #222228;
    --border: #27272a;
    --border2: #333338;
    --text: #e8e6e3;
    --text-dim: #888;
    --text-dimmer: #555;
    --accent: #22d3ee;
    --accent-dim: rgba(34,211,238,0.12);
    --accent2: #34d399;
    --accent2-dim: rgba(52,211,153,0.12);
    --user-accent: #cc785c;
    --asst-accent: #5c9ecc;
    --tag-bg: rgba(34,211,238,0.08);
    --tag-border: rgba(34,211,238,0.2);
    --warn: #f59e0b;
    --code-bg: #0e0e10;
    --scrollbar: #2a2a2e;
    --selected: rgba(34,211,238,0.06);
    --hover: rgba(255,255,255,0.02);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 13px;
    line-height: 1.65;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }

  /* ─── Header ─── */
  #header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  #header h1 {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .header-stat {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dimmer);
    background: var(--surface2);
    padding: 2px 8px;
    border-radius: 3px;
    border: 1px solid var(--border);
  }

  #global-search {
    margin-left: auto;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 12px;
    border-radius: 5px;
    font-size: 12px;
    font-family: inherit;
    outline: none;
    width: 220px;
    transition: border-color 0.15s;
  }
  #global-search:focus { border-color: var(--accent); }
  #global-search::placeholder { color: var(--text-dimmer); }

  /* ─── Three-Column Layout ─── */
  #layout {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ─── Left: File List ─── */
  #file-panel {
    width: 260px;
    min-width: 200px;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    background: var(--surface);
  }

  #file-panel-header {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #file-panel-header span {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .panel-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dimmer);
    background: var(--surface2);
    padding: 1px 6px;
    border-radius: 3px;
  }

  #tag-filter {
    padding: 6px 12px;
    border-bottom: 1px solid var(--border);
    display: none;
    flex-wrap: wrap;
    gap: 4px;
    max-height: 120px;
    overflow-y: auto;
    align-items: flex-start;
    align-content: flex-start;
  }

  #tag-filter.visible { display: flex; }

  .tag-toggle-btn {
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-dimmer);
    cursor: pointer;
    padding: 2px 8px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: transparent;
    transition: all 0.15s;
    margin-left: auto;
  }
  .tag-toggle-btn:hover { color: var(--accent); border-color: var(--accent); }
  .tag-toggle-btn.active { color: var(--accent); border-color: var(--accent); }

  .tag-chip {
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    padding: 2px 7px;
    border-radius: 3px;
    background: var(--tag-bg);
    border: 1px solid var(--tag-border);
    color: var(--accent);
    cursor: pointer;
    transition: all 0.15s;
  }
  .tag-chip:hover { background: rgba(34,211,238,0.15); }
  .tag-chip.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }

  .tag-clear {
    font-size: 10px;
    color: var(--text-dimmer);
    cursor: pointer;
    padding: 2px 6px;
  }
  .tag-clear:hover { color: var(--text); }

  #file-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
  }

  .file-item {
    padding: 8px 12px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: all 0.1s;
  }
  .file-item:hover { background: var(--hover); }
  .file-item.selected {
    background: var(--selected);
    border-left-color: var(--accent);
  }

  .file-date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dimmer);
  }

  .file-title {
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.4;
    margin-top: 2px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .file-part {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--accent);
    margin-top: 2px;
  }

  .file-tags {
    margin-top: 4px;
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
  }

  .file-tag {
    font-size: 9px;
    font-family: 'JetBrains Mono', monospace;
    padding: 1px 5px;
    border-radius: 2px;
    background: var(--surface2);
    color: var(--text-dimmer);
  }

  /* ─── Center: Summary ─── */
  #summary-panel {
    flex: 1;
    min-width: 300px;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  #summary-panel-header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  #summary-panel-header span {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  #summary-content {
    padding: 20px 20px 40px;
    flex: 1;
  }

  .summary-empty {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-dimmer);
    font-size: 13px;
  }

  /* Summary sections */
  .s-title {
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.4;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  .s-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 16px;
  }

  .s-section-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 20px 0 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }

  .s-section-content {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.75;
  }

  .s-section-content p { margin-bottom: 8px; }
  .s-section-content ul { padding-left: 16px; margin: 6px 0; }
  .s-section-content li { margin: 4px 0; }
  .s-section-content strong { color: var(--text); font-weight: 600; }
  .s-section-content code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    background: var(--code-bg);
    border: 1px solid var(--border);
    padding: 1px 5px;
    border-radius: 3px;
    color: #c5a876;
  }

  .s-related {
    margin-top: 6px;
  }
  .s-related-link {
    font-size: 12px;
    color: var(--accent);
    cursor: pointer;
    text-decoration: none;
    transition: color 0.15s;
  }
  .s-related-link:hover { color: var(--accent2); text-decoration: underline; }

  .s-tag-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .s-tag {
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    padding: 2px 7px;
    border-radius: 3px;
    background: var(--tag-bg);
    border: 1px solid var(--tag-border);
    color: var(--accent);
    cursor: pointer;
  }
  .s-tag:hover { background: rgba(34,211,238,0.18); }

  /* ─── Right: Conversation ─── */
  #convo-panel {
    flex: 1;
    min-width: 300px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  #convo-panel-header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #convo-panel-header span {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  #convo-search {
    margin-left: auto;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 11px;
    font-family: inherit;
    outline: none;
    width: 180px;
  }
  #convo-search:focus { border-color: var(--accent); }
  #convo-search::placeholder { color: var(--text-dimmer); }

  #convo-content {
    padding: 16px 20px 40px;
    flex: 1;
  }

  .convo-empty {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-dimmer);
    font-size: 13px;
  }

  /* Conversation messages */
  .msg { margin-bottom: 4px; }

  .msg-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 0 4px;
  }

  .msg-h .msg-header { flex-direction: row-reverse; }

  .msg-badge {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 3px;
  }

  .msg-h .msg-badge {
    background: rgba(204,120,92,0.15);
    color: var(--user-accent);
    border: 1px solid rgba(204,120,92,0.25);
  }

  .msg-a .msg-badge {
    background: rgba(92,158,204,0.12);
    color: var(--asst-accent);
    border: 1px solid rgba(92,158,204,0.2);
  }

  .msg-body {
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    margin-bottom: 4px;
    font-size: 13px;
    line-height: 1.7;
  }

  .msg-h .msg-body {
    border-right: 3px solid rgba(204,120,92,0.35);
    border-left: none;
  }

  .msg-a .msg-body {
    border-left: 3px solid rgba(92,158,204,0.25);
  }

  .msg-body p { margin: 6px 0; }
  .msg-body pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 10px 14px;
    overflow-x: auto;
    margin: 8px 0;
  }
  .msg-body pre code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: #c8c0b0;
    background: none;
    border: none;
    padding: 0;
  }
  .msg-body code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    background: var(--code-bg);
    border: 1px solid var(--border);
    padding: 1px 5px;
    border-radius: 3px;
    color: #c5a876;
  }
  .msg-body strong { color: var(--text); font-weight: 600; }
  .msg-body em { color: var(--text-dim); }
  .msg-body ul, .msg-body ol { padding-left: 18px; margin: 6px 0; }
  .msg-body li { margin: 3px 0; }
  .msg-body blockquote {
    border-left: 3px solid var(--border2);
    padding-left: 12px;
    color: var(--text-dim);
    margin: 8px 0;
  }
  .msg-body h1, .msg-body h2, .msg-body h3 { font-weight: 600; margin: 14px 0 6px; color: var(--text); }
  .msg-body h1 { font-size: 16px; }
  .msg-body h2 { font-size: 14px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  .msg-body h3 { font-size: 13px; color: var(--text-dim); }
  .msg-body table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 12px; }
  .msg-body th, .msg-body td { border: 1px solid var(--border); padding: 5px 8px; text-align: left; }
  .msg-body th { background: var(--surface2); color: var(--text-dim); font-weight: 600; }
  .msg-body hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }

  .exchange-div {
    height: 1px;
    background: var(--border);
    margin: 16px 0;
    opacity: 0.4;
  }

  .highlight { background: rgba(204,120,92,0.3); border-radius: 2px; padding: 0 1px; }

  /* ─── Extract Button ─── */
  .extract-btn {
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid rgba(52,211,153,0.3);
    background: rgba(52,211,153,0.06);
    color: var(--accent2);
    cursor: pointer;
    transition: all 0.15s;
  }
  .extract-btn:hover { background: rgba(52,211,153,0.15); border-color: var(--accent2); }

  /* ─── Evergreen Editor Panel ─── */
  #evergreen-panel {
    display: none;
    flex-direction: column;
    flex: 1;
    min-width: 300px;
    overflow: hidden;
  }

  #evergreen-panel.visible { display: flex; }
  #convo-panel.hidden-by-editor { display: none; }

  #evergreen-header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #evergreen-header span {
    font-size: 11px;
    font-weight: 600;
    color: var(--accent2);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .eg-close-btn {
    margin-left: auto;
    font-size: 11px;
    color: var(--text-dimmer);
    cursor: pointer;
    padding: 2px 8px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: transparent;
  }
  .eg-close-btn:hover { color: var(--text); border-color: var(--text-dim); }

  .eg-export-btn {
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    padding: 4px 12px;
    border-radius: 4px;
    border: 1px solid var(--accent2);
    background: rgba(52,211,153,0.1);
    color: var(--accent2);
    cursor: pointer;
    transition: all 0.15s;
  }
  .eg-export-btn:hover { background: rgba(52,211,153,0.25); }

  #evergreen-editor {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px 40px;
  }

  .eg-field-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent2);
    margin: 14px 0 5px;
  }

  .eg-field-label:first-child { margin-top: 0; }

  .eg-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 11px;
    border-radius: 5px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  .eg-input:focus { border-color: var(--accent2); }

  .eg-textarea {
    width: 100%;
    min-height: 280px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 5px;
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    line-height: 1.7;
    outline: none;
    resize: vertical;
    transition: border-color 0.15s;
  }
  .eg-textarea:focus { border-color: var(--accent2); }

  .eg-hint {
    font-size: 10px;
    color: var(--text-dimmer);
    margin-top: 3px;
    font-style: italic;
  }

  /* ─── Drop Zone (initial state) ─── */
  #drop-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    z-index: 1000;
    gap: 16px;
    text-align: center;
    transition: opacity 0.3s;
  }

  #drop-overlay.hidden { display: none; }
  #drop-overlay.dragging { background: rgba(10,10,11,0.97); }

  .drop-icon {
    width: 72px;
    height: 72px;
    border: 2px dashed var(--border2);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: var(--text-dimmer);
    transition: all 0.2s;
  }

  #drop-overlay.dragging .drop-icon {
    border-color: var(--accent);
    color: var(--accent);
  }

  .drop-title { font-size: 16px; font-weight: 600; color: var(--text-dim); }
  .drop-sub { font-size: 13px; color: var(--text-dimmer); max-width: 380px; }

  .browse-btn {
    background: var(--surface2);
    border: 1px solid var(--border2);
    color: var(--text-dim);
    padding: 8px 24px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    transition: all 0.15s;
  }
  .browse-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ─── Keyboard hint ─── */
  #kbd-hint {
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: var(--text-dimmer);
    font-family: 'JetBrains Mono', monospace;
    z-index: 10;
  }

  kbd {
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 1px 5px;
    border-radius: 3px;
    font-family: inherit;
    font-size: 10px;
  }
</style>
</head>
<body>

<div id="header">
  <h1>Archive Viewer</h1>
  <span class="header-stat" id="file-count">0 files</span>
  <span class="header-stat" id="active-filter" style="display:none"></span>
  <input type="text" id="global-search" placeholder="搜尋所有封存檔..." />
</div>

<div id="layout">
  <!-- Left: File List -->
  <div id="file-panel">
    <div id="file-panel-header">
      <span>封存檔案</span>
      <span class="panel-count" id="shown-count"></span>
      <button class="tag-toggle-btn" id="tag-toggle-btn" onclick="toggleTagPanel()">Tags ▸</button>
    </div>
    <div id="tag-filter"></div>
    <div id="file-list"></div>
  </div>

  <!-- Center: Summary -->
  <div id="summary-panel">
    <div id="summary-panel-header">
      <span>摘要</span>
      <button class="extract-btn" id="extract-btn" onclick="openEvergreenEditor()" style="margin-left:auto">✦ 萃取 Evergreen</button>
    </div>
    <div id="summary-content">
      <div class="summary-empty">← 選取檔案以檢視摘要</div>
    </div>
  </div>

  <!-- Right: Conversation -->
  <div id="convo-panel">
    <div id="convo-panel-header">
      <span>對話全文</span>
      <input type="text" id="convo-search" placeholder="搜尋對話內容..." />
    </div>
    <div id="convo-content">
      <div class="convo-empty">選取檔案後顯示對話全文</div>
    </div>
  </div>

  <!-- Right (alternate): Evergreen Editor -->
  <div id="evergreen-panel">
    <div id="evergreen-header">
      <span>✦ Evergreen Note</span>
      <button class="eg-export-btn" onclick="exportEvergreen()">匯出 .md</button>
      <button class="eg-close-btn" onclick="closeEvergreenEditor()">✕ 返回對話</button>
    </div>
    <div id="evergreen-editor">
      <div class="eg-field-label">命題式標題</div>
      <input type="text" class="eg-input" id="eg-title" placeholder="例：Agent 的完整行為由全域規範、能力模組、執行流程三層定義" />
      <div class="eg-hint">一個可判斷真偽的肯定句，而非主題標籤</div>

      <div class="eg-field-label">Type</div>
      <select class="eg-input" id="eg-type">
        <option value="concept">concept</option>
        <option value="decision">decision</option>
        <option value="reference">reference</option>
        <option value="log">log</option>
      </select>

      <div class="eg-field-label">Domain</div>
      <input type="text" class="eg-input" id="eg-domain" placeholder="例：ai-agent" />

      <div class="eg-field-label">Tags</div>
      <input type="text" class="eg-input" id="eg-tags" placeholder="逗號分隔，例：agent-architecture, skills, workflow" />

      <div class="eg-field-label">內容</div>
      <textarea class="eg-textarea" id="eg-content"></textarea>
      <div class="eg-hint">支援 Markdown。可用 [!concept]、[!evidence]、[!reflection] callout 標記語義。從左欄摘要或對話中複製文字貼入。</div>
    </div>
  </div>
</div>

<!-- Drop overlay -->
<div id="drop-overlay">
  <div class="drop-icon">📚</div>
  <div class="drop-title">拖曳封存 .md 檔案到這裡</div>
  <div class="drop-sub">支援多檔拖曳。檔案需遵循 conversation-archive protocol 格式。</div>
  <button class="browse-btn" onclick="document.getElementById('file-input').click()">選擇檔案</button>
  <input type="file" id="file-input" accept=".md" multiple style="display:none" onchange="handleFiles(this.files)">
</div>

<div id="kbd-hint">
  <kbd>↑</kbd><kbd>↓</kbd> 切換檔案 &nbsp;
  <kbd>/</kbd> 搜尋 &nbsp;
  <kbd>Esc</kbd> 清除篩選
</div>

<script>
// ─── State ───
let archives = [];       // parsed archive objects
let selectedIdx = -1;
let activeTag = null;
let globalQuery = '';
let convoQuery = '';

// ─── Parse a single .md archive ───
function parseArchive(text, filename) {
  const arc = { filename, raw: text, fm: {}, title: '', sections: {}, conversation: '', tags: [] };

  // Frontmatter
  const fmMatch = text.match(/^---\s*\n([\s\S]*?)\n---/);
  if (fmMatch) {
    const fmText = fmMatch[1];
    // Simple YAML parser for our known fields
    const get = (key) => {
      const m = fmText.match(new RegExp(`^${key}:\\s*(.+)`, 'm'));
      return m ? m[1].trim() : '';
    };
    const getList = (key) => {
      // inline array: [a, b, c]
      const m = fmText.match(new RegExp(`^${key}:\\s*\\[([^\\]]*)]`, 'm'));
      if (m) return m[1].split(',').map(s => s.trim().replace(/^["']|["']$/g, '')).filter(Boolean);
      // multi-line array:
      //   - item
      const lines = [];
      const re = new RegExp(`^${key}:\\s*$`, 'm');
      const idx = fmText.search(re);
      if (idx >= 0) {
        const rest = fmText.substring(idx).split('\n').slice(1);
        for (const l of rest) {
          const lm = l.match(/^\s+-\s+(.+)/);
          if (lm) lines.push(lm[1].trim().replace(/^["']|["']$/g, ''));
          else break;
        }
      }
      return lines;
    };

    arc.fm = {
      type: get('type'),
      status: get('status'),
      domain: get('domain'),
      created: get('created'),
      archived: get('archived'),
      part: get('part'),
      source: get('source'),
    };
    arc.tags = getList('tags');
    arc.fm.related_domains = getList('related_domains');
    arc.fm.related_conversations = getList('related_conversations');
  }

  // Content after frontmatter
  const content = text.replace(/^---[\s\S]*?---\s*/, '');

  // Title: first H1
  const titleMatch = content.match(/^#\s+(.+)/m);
  arc.title = titleMatch ? titleMatch[1].trim() : filename;

  // Sections: ## headers
  const sectionNames = ['脈絡', '發展軌跡', '關鍵概念', '決議', '產出物', '關鍵字'];
  for (const name of sectionNames) {
    const re = new RegExp(`## ${name}\\s*\\n([\\s\\S]*?)(?=\\n## |$)`);
    const m = content.match(re);
    arc.sections[name] = m ? m[1].trim() : '';
  }

  // Conversation: inside <details>
  const detailsMatch = content.match(/<details>[\s\S]*?<\/summary>\s*([\s\S]*?)\s*<\/details>/);
  arc.conversation = detailsMatch ? detailsMatch[1].trim() : '';

  return arc;
}

// ─── Render File List ───
function renderFileList() {
  const list = document.getElementById('file-list');
  const filtered = getFilteredArchives();

  list.innerHTML = '';
  filtered.forEach((arc, i) => {
    const realIdx = archives.indexOf(arc);
    const el = document.createElement('div');
    el.className = 'file-item' + (realIdx === selectedIdx ? ' selected' : '');
    el.onclick = () => selectFile(realIdx);

    const dateStr = arc.fm.created || '';
    const partStr = arc.fm.part ? `Part ${arc.fm.part}` : '';
    const tagsHtml = arc.tags.slice(0, 4).map(t =>
      `<span class="file-tag">${t}</span>`
    ).join('');

    el.innerHTML = `
      <div class="file-date">${dateStr}${partStr ? ' · ' + partStr : ''}</div>
      <div class="file-title">${highlightText(arc.title, globalQuery)}</div>
      ${tagsHtml ? '<div class="file-tags">' + tagsHtml + '</div>' : ''}
    `;
    list.appendChild(el);
  });

  document.getElementById('shown-count').textContent = filtered.length + '/' + archives.length;
  document.getElementById('file-count').textContent = archives.length + ' files';
}

function getFilteredArchives() {
  let result = archives;

  if (activeTag) {
    result = result.filter(a => {
      // Check frontmatter tags
      if (a.tags.includes(activeTag)) return true;
      // Check 關鍵字 section
      if (a.sections['關鍵字']) {
        const keywords = a.sections['關鍵字'].split(/[,，\n]/).map(k => k.trim());
        if (keywords.includes(activeTag)) return true;
      }
      return false;
    });
  }

  if (globalQuery) {
    const q = globalQuery.toLowerCase();
    result = result.filter(a =>
      a.title.toLowerCase().includes(q) ||
      a.tags.some(t => t.toLowerCase().includes(q)) ||
      Object.values(a.sections).some(s => s.toLowerCase().includes(q))
    );
  }

  return result;
}

// ─── Render Summary ───
function renderSummary(arc) {
  const el = document.getElementById('summary-content');
  if (!arc) {
    el.innerHTML = '<div class="summary-empty">← 選取檔案以檢視摘要</div>';
    return;
  }

  // Meta tags
  const metaHtml = [
    arc.fm.domain ? `<span class="tag-chip">${arc.fm.domain}</span>` : '',
    arc.fm.source ? `<span class="tag-chip">${arc.fm.source}</span>` : '',
    arc.fm.status ? `<span class="tag-chip">${arc.fm.status}</span>` : '',
    arc.fm.part ? `<span class="tag-chip">Part ${arc.fm.part}</span>` : '',
  ].filter(Boolean).join('');

  // Sections
  const sectionOrder = ['脈絡', '發展軌跡', '關鍵概念', '決議', '產出物', '關鍵字'];
  let sectionsHtml = '';

  for (const name of sectionOrder) {
    const content = arc.sections[name];
    if (!content) continue;

    if (name === '關鍵字') {
      const keywords = content.split(/[,，]/).map(k => k.trim()).filter(Boolean);
      sectionsHtml += `
        <div class="s-section-label">${name}</div>
        <div class="s-tag-list">${keywords.map(k =>
          `<span class="s-tag" onclick="filterByTag('${k.replace(/'/g, "\\'")}')">${k}</span>`
        ).join('')}</div>
      `;
    } else {
      sectionsHtml += `
        <div class="s-section-label">${name}</div>
        <div class="s-section-content">${renderMd(content)}</div>
      `;
    }
  }

  // Related conversations
  let relatedHtml = '';
  if (arc.fm.related_conversations && arc.fm.related_conversations.length) {
    relatedHtml = `
      <div class="s-section-label">相關對話</div>
      <div class="s-related">
        ${arc.fm.related_conversations.map(r =>
          `<div><span class="s-related-link" onclick="jumpToRelated('${r.replace(/'/g, "\\'")}')">${r}</span></div>`
        ).join('')}
      </div>
    `;
  }

  el.innerHTML = `
    <div class="s-title">${arc.title}</div>
    <div class="s-meta">${metaHtml}</div>
    ${sectionsHtml}
    ${relatedHtml}
  `;
}

// ─── Render Conversation ───
function renderConversation(arc) {
  const el = document.getElementById('convo-content');
  if (!arc || !arc.conversation) {
    el.innerHTML = '<div class="convo-empty">此封存檔沒有對話全文</div>';
    return;
  }

  // Parse H:/A: turns
  const lines = arc.conversation.split('\n');
  let turns = [];
  let current = null;

  for (const line of lines) {
    const m = line.match(/^(H|A):\s*(.*)/);
    if (m) {
      if (current) turns.push(current);
      current = { speaker: m[1], lines: [m[2]] };
    } else if (current) {
      current.lines.push(line);
    }
  }
  if (current) turns.push(current);

  if (turns.length === 0) {
    // Fallback: render as plain text
    el.innerHTML = `<div class="msg"><div class="msg-body">${renderMd(maybeHighlightConvo(arc.conversation))}</div></div>`;
    return;
  }

  let html = '';
  let prevSpeaker = null;

  for (const turn of turns) {
    if (prevSpeaker && prevSpeaker !== turn.speaker) {
      html += '<div class="exchange-div"></div>';
    }
    prevSpeaker = turn.speaker;

    const cls = turn.speaker === 'H' ? 'msg-h' : 'msg-a';
    const label = turn.speaker === 'H' ? 'You' : 'Agent';
    const text = turn.lines.join('\n');

    html += `
      <div class="msg ${cls}">
        <div class="msg-header">
          <span class="msg-badge">${label}</span>
        </div>
        <div class="msg-body">${renderMd(maybeHighlightConvo(text))}</div>
      </div>
    `;
  }

  el.innerHTML = html;
}

// ─── Selection ───
function selectFile(idx) {
  selectedIdx = idx;
  const arc = archives[idx];
  renderFileList();
  renderSummary(arc);
  renderConversation(arc);
}

function jumpToRelated(name) {
  const idx = archives.findIndex(a =>
    a.title.includes(name) || a.filename.includes(name) ||
    (a.fm.related_conversations || []).some(r => r === name)
  );
  if (idx >= 0) selectFile(idx);
}

function filterByTag(tag) {
  if (activeTag === tag) {
    activeTag = null;
  } else {
    activeTag = tag;
  }
  renderTagFilter();
  renderFileList();
  const af = document.getElementById('active-filter');
  if (activeTag) {
    af.style.display = '';
    af.textContent = 'tag: ' + activeTag;
  } else {
    af.style.display = 'none';
  }
}

let tagPanelOpen = false;

function toggleTagPanel() {
  tagPanelOpen = !tagPanelOpen;
  const btn = document.getElementById('tag-toggle-btn');
  const panel = document.getElementById('tag-filter');
  if (tagPanelOpen) {
    btn.textContent = 'Tags ▾';
    btn.classList.add('active');
    renderTagFilter();
  } else {
    btn.textContent = 'Tags ▸';
    btn.classList.remove('active');
    panel.classList.remove('visible');
  }
}

function renderTagFilter() {
  const el = document.getElementById('tag-filter');
  if (!tagPanelOpen) { el.classList.remove('visible'); return; }

  // Merge frontmatter tags + 關鍵字 section
  const allTags = new Map();
  for (const a of archives) {
    // frontmatter tags
    for (const t of a.tags) {
      allTags.set(t, (allTags.get(t) || 0) + 1);
    }
    // 關鍵字 section (comma or Chinese comma separated)
    if (a.sections['關鍵字']) {
      const keywords = a.sections['關鍵字'].split(/[,，\n]/).map(k => k.trim()).filter(Boolean);
      for (const k of keywords) {
        allTags.set(k, (allTags.get(k) || 0) + 1);
      }
    }
  }
  // Sort by frequency
  const sorted = [...allTags.entries()].sort((a, b) => b[1] - a[1]);

  if (sorted.length === 0) { el.classList.remove('visible'); return; }
  el.classList.add('visible');

  el.innerHTML = sorted.map(([tag]) =>
    `<span class="tag-chip ${activeTag === tag ? 'active' : ''}" onclick="filterByTag('${tag.replace(/'/g, "\\'")}')">${tag}</span>`
  ).join('') + (activeTag ? '<span class="tag-clear" onclick="filterByTag(null)">✕ 清除</span>' : '');
}

// ─── Markdown renderer (simple) ───
function renderMd(text) {
  let html = text;

  // Code blocks
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) =>
    `<pre><code>${escHtml(code.trim())}</code></pre>`
  );

  // Inline code — protect
  const codes = [];
  html = html.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\x00C${codes.length-1}\x00`; });

  // Headers
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

  // HR
  html = html.replace(/^---+$/gm, '<hr>');

  // Bold / italic
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');

  // Blockquote
  html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');

  // Unordered list
  html = html.replace(/((?:^[-*] .+\n?)+)/gm, block => {
    const items = block.trim().split('\n').map(l => `<li>${l.replace(/^[-*] /, '')}</li>`).join('');
    return `<ul>${items}</ul>`;
  });

  // Paragraphs
  html = html.split(/\n{2,}/).map(p => {
    p = p.trim();
    if (!p) return '';
    if (/^<(h[123]|ul|ol|pre|blockquote|hr)/.test(p)) return p;
    return `<p>${p.replace(/\n/g, '<br>')}</p>`;
  }).join('');

  // Restore inline codes
  html = html.replace(/\x00C(\d+)\x00/g, (_, i) => `<code>${escHtml(codes[parseInt(i)])}</code>`);

  return html;
}

function escHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function highlightText(text, query) {
  if (!query) return text;
  const esc = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(esc, 'gi'), m => `<mark class="highlight">${m}</mark>`);
}

function maybeHighlightConvo(text) {
  return convoQuery ? highlightText(text, convoQuery) : text;
}

// ─── File loading ───
function handleFiles(fileList) {
  const files = Array.from(fileList);
  let loaded = 0;

  for (const file of files) {
    const reader = new FileReader();
    reader.onload = e => {
      const arc = parseArchive(e.target.result, file.name);
      archives.push(arc);
      loaded++;
      if (loaded === files.length) {
        // Sort by created date desc
        archives.sort((a, b) => (b.fm.created || '').localeCompare(a.fm.created || ''));
        document.getElementById('drop-overlay').classList.add('hidden');
        renderTagFilter();
        renderFileList();
        if (archives.length > 0) selectFile(0);
      }
    };
    reader.readAsText(file);
  }
}

// ─── Drag & Drop ───
const overlay = document.getElementById('drop-overlay');
document.addEventListener('dragover', e => { e.preventDefault(); overlay.classList.add('dragging'); });
document.addEventListener('dragleave', () => overlay.classList.remove('dragging'));
document.addEventListener('drop', e => {
  e.preventDefault();
  overlay.classList.remove('dragging');
  if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
});

// ─── Keyboard Navigation ───
document.addEventListener('keydown', e => {
  const filtered = getFilteredArchives();

  if (e.key === 'ArrowDown' || e.key === 'j') {
    e.preventDefault();
    if (filtered.length === 0) return;
    const currentFiltered = filtered.indexOf(archives[selectedIdx]);
    const nextFiltered = Math.min(currentFiltered + 1, filtered.length - 1);
    selectFile(archives.indexOf(filtered[nextFiltered]));
    scrollFileIntoView();
  } else if (e.key === 'ArrowUp' || e.key === 'k') {
    e.preventDefault();
    if (filtered.length === 0) return;
    const currentFiltered = filtered.indexOf(archives[selectedIdx]);
    const prevFiltered = Math.max(currentFiltered - 1, 0);
    selectFile(archives.indexOf(filtered[prevFiltered]));
    scrollFileIntoView();
  } else if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault();
    document.getElementById('global-search').focus();
  } else if (e.key === 'Escape') {
    activeTag = null;
    globalQuery = '';
    convoQuery = '';
    document.getElementById('global-search').value = '';
    document.getElementById('convo-search').value = '';
    document.getElementById('active-filter').style.display = 'none';
    renderTagFilter();
    renderFileList();
    document.activeElement.blur();
  }
});

function scrollFileIntoView() {
  const selected = document.querySelector('.file-item.selected');
  if (selected) selected.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

// ─── Search Bindings ───
document.getElementById('global-search').addEventListener('input', e => {
  globalQuery = e.target.value.trim();
  renderFileList();
});

document.getElementById('convo-search').addEventListener('input', e => {
  convoQuery = e.target.value.trim();
  if (selectedIdx >= 0) renderConversation(archives[selectedIdx]);
});

// Also allow dropping files when overlay is hidden
document.getElementById('layout').addEventListener('drop', e => {
  e.preventDefault();
  if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
});
document.getElementById('layout').addEventListener('dragover', e => e.preventDefault());

// ─── Evergreen Editor ───
function openEvergreenEditor() {
  if (selectedIdx < 0) return;
  const arc = archives[selectedIdx];

  // Hide convo panel, show editor
  document.getElementById('convo-panel').classList.add('hidden-by-editor');
  document.getElementById('evergreen-panel').classList.add('visible');

  // Pre-fill from current archive
  document.getElementById('eg-title').value = '';
  document.getElementById('eg-domain').value = arc.fm.domain || '';
  document.getElementById('eg-tags').value = arc.tags.slice(0, 5).join(', ');

  const today = new Date().toISOString().split('T')[0];
  const template = `> [!concept] 概念名稱
> 在此寫下概念的定義。

> [!evidence] 來源
> 來自對話「${arc.title}」（${arc.fm.created || ''}）。

> [!reflection] 與現有知識的關係
> 在此寫下這個概念如何連接到你已知的東西。
`;

  document.getElementById('eg-content').value = template;
  document.getElementById('eg-title').focus();
}

function closeEvergreenEditor() {
  document.getElementById('convo-panel').classList.remove('hidden-by-editor');
  document.getElementById('evergreen-panel').classList.remove('visible');
}

function exportEvergreen() {
  const title = document.getElementById('eg-title').value.trim() || 'Untitled';
  const type = document.getElementById('eg-type').value;
  const domain = document.getElementById('eg-domain').value.trim();
  const tags = document.getElementById('eg-tags').value.trim();
  const content = document.getElementById('eg-content').value;
  const today = new Date().toISOString().split('T')[0];

  const tagsArr = tags ? tags.split(/[,，]/).map(t => t.trim()).filter(Boolean) : [];
  const tagsYaml = tagsArr.length ? `[${tagsArr.join(', ')}]` : '[]';

  // Build source reference
  let sourceRef = '';
  if (selectedIdx >= 0) {
    const arc = archives[selectedIdx];
    sourceRef = arc.filename || arc.title;
  }

  const md = `---
type: ${type}
status: seedling
domain: ${domain}
created: ${today}
updated: ${today}
tags: ${tagsYaml}
source: conversation
source_ref: "${sourceRef}"
---

# ${title}

${content}
`;

  // Download as .md file
  const slug = title.replace(/[^\w\u4e00-\u9fff]+/g, '-').replace(/^-|-$/g, '').substring(0, 60);
  const filename = `${slug || 'evergreen'}.md`;

  const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
